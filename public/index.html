<!doctype html>
<html lang="et">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4b1020">
<title>kõrva(n)uss</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,700;6..96,900&family=DM+Sans:wght@400;500;700&family=Shrikhand&display=swap" rel="stylesheet">

<style>
:root{
  color-scheme:light;
  --wine:#5a1326;
  --wine2:#2b0912;
  --red:#ac2941;
  --pink:#efa7ba;
  --blush:#ffdbe4;
  --cream:#f8ebd9;
  --paper:#f1ddc3;
  --gold:#bf8d34;
  --gold2:#dfbd70;
  --green:#3f7951;
  --ink:#1c1214;
  --muted:#776064;
  --shadow:rgba(37,7,15,.28);
}

*{box-sizing:border-box}

html{
  background:var(--wine2);
}

body{
  margin:0;
  min-height:100%;
  color:var(--ink);
  font-family:"DM Sans",sans-serif;
  background:
    radial-gradient(circle at 15% 3%,rgba(255,136,165,.48),transparent 24rem),
    radial-gradient(circle at 92% 18%,rgba(241,172,187,.35),transparent 19rem),
    linear-gradient(180deg,#6f1b32 0%,#3a0d1b 58%,#250811 100%);
}

button,
input,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

button,
a{
  -webkit-tap-highlight-color:transparent;
}

.hidden{
  display:none!important;
}

main{
  width:min(780px,100%);
  margin:auto;
  padding:
    max(18px,env(safe-area-inset-top))
    14px
    72px;
}

/* LANGUAGE */

.language-switch{
  display:flex;
  justify-content:center;
  gap:8px;
  margin:2px 0 8px;
}

.language-switch button{
  min-height:34px;
  padding:5px 11px;
  box-shadow:none;
  border:1px solid var(--gold2);
  background:rgba(42,8,18,.42);
  color:var(--cream);
  font-size:12px;
  letter-spacing:.09em;
}

.language-switch button.active{
  background:var(--gold2);
  color:var(--wine2);
}

/* HEADER */

header{
  text-align:center;
  color:var(--cream);
  padding:4px 4px 10px;
}

.stars{
  color:var(--gold2);
  letter-spacing:.45em;
  font-size:18px;
}

.logo{
  font-family:"Shrikhand",serif;
  font-size:clamp(42px,12vw,84px);
  line-height:.95;
  letter-spacing:-.045em;
  color:var(--blush);
  text-shadow:
    3px 3px 0 var(--wine2),
    5px 5px 0 var(--gold);
}

.logo .n{
  color:var(--gold2);
  font-size:.72em;
  vertical-align:.08em;
}

.subtitle{
  font-family:"Bodoni Moda",serif;
  font-style:italic;
  font-size:clamp(16px,4vw,23px);
  margin-top:8px;
}

/* CARDS */

.card{
  position:relative;
  margin:14px 0;
  padding:18px;
  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.95),
      rgba(248,235,217,.98)
    );
  border:2px solid var(--gold);
  border-radius:18px;
  box-shadow:
    0 12px 30px var(--shadow),
    inset 0 0 0 4px rgba(255,255,255,.42);
}

.card::after{
  content:"✦";
  position:absolute;
  top:7px;
  right:11px;
  color:var(--gold);
}

.card-title{
  font-family:"Bodoni Moda",serif;
  text-transform:uppercase;
  letter-spacing:.12em;
  font-size:12px;
  font-weight:900;
  color:var(--wine);
  margin-bottom:10px;
}

.grid{
  display:grid;
  gap:12px;
}

.grid2{
  grid-template-columns:
    repeat(2,minmax(0,1fr));
}

.flex{
  display:flex;
  gap:10px;
  align-items:center;
  flex-wrap:wrap;
}

.small{
  font-size:13px;
  line-height:1.58;
}

.muted{
  color:var(--muted);
}

.center{
  text-align:center;
}

.ornament{
  display:flex;
  align-items:center;
  gap:10px;
  color:var(--gold);
  margin:12px 0;
}

.ornament::before,
.ornament::after{
  content:"";
  height:1px;
  background:currentColor;
  flex:1;
}

.ornament span{
  font-family:"Bodoni Moda",serif;
  font-style:italic;
}

/* PHOTOS */

.photo-frame{
  background:var(--cream);
  border:7px solid var(--cream);
  outline:2px solid var(--gold);
  box-shadow:0 12px 28px var(--shadow);
  margin:18px 0;
  overflow:hidden;
}

.photo-frame img{
  display:block;
  width:100%;
  height:auto;
  object-fit:contain;
}

.photo-caption{
  padding:9px 8px 4px;
  text-align:center;
  color:var(--wine);
  font-family:"Bodoni Moda",serif;
  font-style:italic;
}

.dream-drift img{
  transform:scale(1.012);
  animation:
    dreamDrift
    18s
    ease-in-out
    infinite
    alternate;
  transform-origin:50% 45%;
}

@keyframes dreamDrift{
  from{
    transform:
      scale(1.012)
      translate3d(-.2%,0,0);
  }

  to{
    transform:
      scale(1.03)
      translate3d(.5%,-.25%,0);
  }
}

/* FORMS */

label{
  display:block;
  color:var(--wine);
  font-weight:700;
}

input,
select{
  width:100%;
  min-height:52px;
  padding:12px 14px;
  margin-top:7px;
  background:#fffaf3;
  color:var(--ink);
  border:2px solid #bd8c94;
  border-radius:12px;
  font-size:16px;
}

input:focus,
select:focus{
  outline:
    3px solid
    rgba(191,141,52,.25);
  border-color:var(--gold);
}

/* BUTTONS */

button,
.button{
  min-height:52px;
  padding:12px 16px;
  border-radius:999px;
  border:2px solid var(--wine);
  background:var(--cream);
  color:var(--wine);
  font-weight:800;
  text-decoration:none;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  box-shadow:
    0 4px 0
    var(--wine2);
  transition:
    transform .1s,
    box-shadow .1s;
}

button:active,
.button:active{
  transform:
    translateY(3px);
  box-shadow:
    0 1px 0
    var(--wine2);
}

button:disabled{
  opacity:.45;
  cursor:not-allowed;
}

.primary{
  background:var(--pink);
  color:var(--wine2);
}

.gold{
  background:var(--gold2);
  color:#43290f;
}

.full{
  width:100%;
}

.home-actions{
  display:grid;
  grid-template-columns:
    1fr 1fr;
  gap:10px;
}

/* RULES */

.rules{
  line-height:1.64;
}

.rule{
  display:grid;
  grid-template-columns:
    34px 1fr;
  gap:9px;
  align-items:start;
  padding:9px 0;
  border-bottom:
    1px dotted
    #b78d83;
}

.rule:last-child{
  border-bottom:0;
}

.rule-number{
  width:30px;
  height:30px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--pink);
  color:var(--wine);
  font-family:"Bodoni Moda",serif;
  font-weight:900;
}

.lynch{
  margin:18px 0 0;
  text-align:center;
  color:var(--wine);
  font-family:"Bodoni Moda",serif;
  font-size:
    clamp(19px,5vw,25px);
  font-style:italic;
  font-weight:700;
}

.lynch cite{
  display:block;
  margin-top:8px;
  font-family:"DM Sans",sans-serif;
  font-size:11px;
  font-style:normal;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--muted);
}

/* LOBBY */

.room-code{
  font-family:"Bodoni Moda",serif;
  font-size:
    clamp(50px,15vw,92px);
  font-weight:900;
  letter-spacing:.08em;
  color:var(--wine);
  text-align:center;
  line-height:1;
}

.join-layout{
  display:grid;
  grid-template-columns:
    1fr 190px;
  gap:18px;
  align-items:center;
}

#qr{
  width:182px;
  min-height:182px;
  padding:6px;
  margin:auto;
  background:#fff;
  border:
    5px double
    var(--gold);
}

#qr img,
#qr canvas{
  display:block!important;
  max-width:100%!important;
  height:auto!important;
}

.players{
  display:grid;
}

.player{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:11px 2px;
  border-bottom:
    1px dotted
    #b78d83;
}

.player:last-child{
  border-bottom:0;
}

.online{
  color:var(--green);
  font-weight:700;
}

.offline{
  color:var(--red);
}

.dj-badge{
  display:inline-block;
  margin-left:6px;
  padding:2px 6px;
  border-radius:999px;
  background:var(--pink);
  color:var(--wine);
  font-size:10px;
  font-weight:900;
}

/* STATUS */

.status-row{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  justify-content:center;
}

.pill{
  padding:7px 11px;
  background:var(--cream);
  border:
    2px solid
    var(--gold);
  border-radius:999px;
  color:var(--wine);
  font-size:12px;
  font-weight:800;
}

.turn-me{
  background:var(--pink);
}

/* SCORE */

.scoreboard{
  display:grid;
  grid-template-columns:
    repeat(
      auto-fit,
      minmax(112px,1fr)
    );
  gap:8px;
  margin-top:13px;
}

.score{
  text-align:center;
  background:var(--cream);
  border:
    2px solid
    var(--gold);
  border-radius:13px;
  padding:10px;
  box-shadow:
    0 6px 15px
    var(--shadow);
}

.score strong{
  display:block;
  color:var(--wine);
}

.score-count{
  color:var(--red);
  font-family:"Bodoni Moda",serif;
  font-weight:900;
  margin-top:3px;
}

/* LISTEN */

.listen-card{
  text-align:center;
}

.unknown{
  font-family:"Bodoni Moda",serif;
  font-size:
    clamp(42px,12vw,76px);
  font-weight:900;
  font-style:italic;
  color:var(--wine);
  line-height:1;
}

.listen-copy{
  font-family:"Bodoni Moda",serif;
  font-style:italic;
  font-size:17px;
  margin:8px 0 14px;
}

.saloon-message{
  margin:12px auto 0;
  max-width:520px;
  color:var(--muted);
  font-family:"Bodoni Moda",serif;
  font-style:italic;
  font-size:14px;
}

/* DJ */

.dj-box{
  margin-top:14px;
  padding:14px;
  background:#f4c8d2;
  border:
    2px solid
    var(--wine);
  border-radius:14px;
  text-align:left;
}

.dj-song{
  font-family:"Bodoni Moda",serif;
  font-size:23px;
  font-weight:900;
  color:var(--wine);
}

.spotify-shell{
  margin-top:12px;
  min-height:154px;
  border-radius:14px;
  overflow:hidden;
  background:#191414;
  border:
    2px solid
    #463226;
}

.spotify-status{
  padding:13px;
  color:#f8ebd9;
  font-size:13px;
  line-height:1.45;
}

.spotify-exact-link{
  margin-top:10px;
  width:100%;
  background:#bce5a7;
  color:#17361d;
  border-color:#44774d;
}

/* TIMELINE */

.timeline-wrap{
  position:relative;
}

.timeline-help{
  margin:4px 0 12px;
}

.timeline-flow{
  display:flex;
  flex-direction:column;
  gap:0;
  padding-bottom:88px;
}

.timeline-card{
  display:grid;
  grid-template-columns:
    82px 1fr;
  gap:12px;
  align-items:center;
  padding:12px 13px;
  background:#fffaf3;
  border:
    2px solid
    var(--gold);
  border-radius:13px;
  box-shadow:
    0 5px 12px
    rgba(68,27,31,.12);
}

.timeline-year{
  font-family:"Bodoni Moda",serif;
  font-size:28px;
  line-height:1;
  font-weight:900;
  color:var(--wine);
  text-align:center;
}

.timeline-copy{
  text-align:left;
  min-width:0;
}

.timeline-song{
  font-family:"Bodoni Moda",serif;
  font-weight:700;
  font-size:15px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.timeline-artist{
  color:var(--muted);
  font-size:11px;
  margin-top:2px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.insert-slot{
  width:
    calc(100% - 22px);
  margin:
    7px auto;
  min-height:48px;
  border:
    2px dashed
    #d992a7;
  box-shadow:none;
  background:
    rgba(255,239,242,.62);
  color:var(--wine);
  position:relative;
}

.insert-slot::before,
.insert-slot::after{
  content:"";
  position:absolute;
  top:50%;
  width:18px;
  height:1px;
  background:#d992a7;
}

.insert-slot::before{
  left:-12px;
}

.insert-slot::after{
  right:-12px;
}

.insert-slot.active{
  background:var(--pink);
  border-style:solid;
  transform:scale(1.01);
}

.guess-dock{
  position:sticky;
  bottom:
    max(
      10px,
      env(safe-area-inset-bottom)
    );
  z-index:15;
  margin-top:-70px;
  padding:10px;
  background:
    rgba(43,9,18,.94);
  border:
    2px solid
    var(--gold2);
  border-radius:18px;
  box-shadow:
    0 12px 32px
    rgba(0,0,0,.38);
  backdrop-filter:
    blur(10px);
}

.guess-dock .choice{
  color:#ffe9d5;
  text-align:center;
  font-size:12px;
  margin-bottom:8px;
}

.locked{
  padding:13px;
  background:#f4c8d2;
  border:
    2px solid
    var(--gold);
  border-radius:12px;
  text-align:center;
  color:var(--wine);
  font-weight:800;
}

/* CAMP REVEAL */

.reveal-card{
  overflow:hidden;
  isolation:isolate;
  background:
    radial-gradient(
      circle at 50% 22%,
      rgba(255,214,132,.25),
      transparent 22rem
    ),
    linear-gradient(
      180deg,
      #25020d 0%,
      #6b132b 58%,
      #26040f 100%
    );
  border:
    3px solid
    var(--gold2);
  color:var(--cream);
  box-shadow:
    0 18px 50px
    rgba(0,0,0,.45),
    inset 0 0 0 5px
    rgba(255,221,160,.08);
}

.reveal-card::after{
  content:"★";
  color:var(--gold2);
  font-size:22px;
}

.reveal-curtain{
  position:absolute;
  inset:0;
  pointer-events:none;
  z-index:-1;
}

.reveal-curtain::before,
.reveal-curtain::after{
  content:"";
  position:absolute;
  top:0;
  bottom:0;
  width:52%;
  background:
    repeating-linear-gradient(
      90deg,
      rgba(50,0,16,.98) 0 28px,
      rgba(110,11,42,.98) 28px 54px
    );
  box-shadow:
    inset 0 0 35px
    rgba(0,0,0,.6);
  transform-origin:top;
}

.reveal-curtain::before{
  left:0;
}

.reveal-curtain::after{
  right:0;
}

.reveal-live
.reveal-curtain::before{
  animation:
    curtainLeft
    .9s
    cubic-bezier(.2,.7,.15,1)
    forwards;
}

.reveal-live
.reveal-curtain::after{
  animation:
    curtainRight
    .9s
    cubic-bezier(.2,.7,.15,1)
    forwards;
}

@keyframes curtainLeft{
  to{
    transform:
      translateX(-94%)
      rotate(-3deg);
  }
}

@keyframes curtainRight{
  to{
    transform:
      translateX(94%)
      rotate(3deg);
  }
}

.reveal-marquee{
  text-align:center;
  color:var(--gold2);
  letter-spacing:.17em;
  font-size:11px;
  font-weight:900;
  text-transform:uppercase;
  margin:2px 0 12px;
}

.reveal-photo{
  width:100%;
  height:auto;
  display:block;
  object-fit:contain;
  border:
    5px solid
    var(--cream);
  outline:
    2px solid
    var(--gold);
  margin-bottom:18px;
  opacity:.96;
}

.reveal-live
.reveal-photo{
  animation:
    photoFlash
    .8s
    .55s
    both;
}

@keyframes photoFlash{
  0%{
    opacity:0;
    filter:
      brightness(2.2)
      contrast(1.2);
  }

  100%{
    opacity:.96;
    filter:none;
  }
}

.big-year{
  text-align:center;
  font-family:"Bodoni Moda",serif;
  font-size:
    clamp(72px,20vw,122px);
  font-weight:900;
  color:var(--gold2);
  line-height:.88;
  margin:17px 0;
  text-shadow:
    3px 3px 0 #23000b,
    0 0 26px
    rgba(255,205,109,.22);
}

.reveal-live
.big-year{
  animation:
    yearCrash
    .7s
    .72s
    cubic-bezier(.17,.88,.25,1.35)
    both;
}

@keyframes yearCrash{
  from{
    opacity:0;
    transform:
      scale(2.2)
      rotate(-8deg);
  }

  to{
    opacity:1;
    transform:
      scale(1)
      rotate(0);
  }
}

.reveal-song{
  text-align:center;
  font-family:"Bodoni Moda",serif;
  font-size:26px;
  font-weight:800;
  color:#fff5e6;
}

.reveal-artist{
  text-align:center;
  color:var(--pink);
  font-family:"Bodoni Moda",serif;
  font-style:italic;
  font-size:19px;
}

.reveal-live
.reveal-song,
.reveal-live
.reveal-artist{
  animation:
    riseIn
    .55s
    1.15s
    both;
}

@keyframes riseIn{
  from{
    opacity:0;
    transform:
      translateY(18px);
  }

  to{
    opacity:1;
    transform:none;
  }
}

.result{
  margin-top:18px;
  font-family:"Shrikhand",serif;
  font-size:
    clamp(40px,12vw,78px);
  line-height:.95;
  text-align:center;
  color:#fff0df;
  text-shadow:
    4px 4px 0
    #25010d;
}

.result.good{
  color:#d9ffb9;
}

.result.bad{
  color:#ff9bb1;
}

.reveal-live
.result{
  animation:
    resultWobble
    .65s
    1.45s
    both;
}

@keyframes resultWobble{
  0%{
    opacity:0;
    transform:
      scale(.2)
      rotate(16deg);
  }

  70%{
    opacity:1;
    transform:
      scale(1.08)
      rotate(-3deg);
  }

  100%{
    transform:
      scale(1)
      rotate(0);
  }
}

.camp-stars{
  height:30px;
  position:relative;
  margin:4px 0;
}

.camp-stars span{
  position:absolute;
  color:var(--gold2);
  opacity:0;
}

.reveal-live
.camp-stars span{
  animation:
    starPop
    1.4s
    1.35s
    ease-out
    both;
}

.camp-stars span:nth-child(1){
  left:5%;
  top:4px;
  font-size:22px;
}

.camp-stars span:nth-child(2){
  left:18%;
  top:15px;
  font-size:13px;
  animation-delay:1.55s;
}

.camp-stars span:nth-child(3){
  left:42%;
  top:2px;
  font-size:18px;
  animation-delay:1.45s;
}

.camp-stars span:nth-child(4){
  right:22%;
  top:13px;
  font-size:14px;
  animation-delay:1.62s;
}

.camp-stars span:nth-child(5){
  right:6%;
  top:1px;
  font-size:24px;
  animation-delay:1.5s;
}

@keyframes starPop{
  0%{
    opacity:0;
    transform:
      scale(.1)
      rotate(0);
  }

  45%{
    opacity:1;
    transform:
      scale(1.4)
      rotate(160deg);
  }

  100%{
    opacity:.8;
    transform:
      scale(1)
      rotate(250deg);
  }
}

.reveal-quote{
  margin:17px auto 5px;
  max-width:560px;
  text-align:center;
  color:#f8dfb1;
  font-family:"Bodoni Moda",serif;
  font-style:italic;
  font-size:17px;
}

.reveal-quote cite{
  display:block;
  margin-top:5px;
  color:#d8ab62;
  font-family:"DM Sans",sans-serif;
  font-style:normal;
  font-size:10px;
  letter-spacing:.12em;
}

.round-results{
  display:grid;
  gap:7px;
  margin-top:16px;
}

function getStored(key){

  try{

    return (
      localStorage.getItem(key) ||
      ""
    );

  }catch{

    return "";

  }

}


function setStored(
  key,
  value
){

  try{

    localStorage.setItem(
      key,
      value
    );

  }catch{}

}


function ensureToken(){

  let token =
    getStored(
      STORAGE.token
    );


  if(
    !token
  ){

    token =

      window.crypto
        ?.randomUUID
        ?.()

      ||

      Math.random()
        .toString(36)
        .slice(2)

      +

      Date.now()
        .toString(36);


    setStored(
      STORAGE.token,
      token
    );

  }


  return token;

}


const playerToken =
  ensureToken();

function deterministicIndex(
  seed,
  length
){

  const str =
    String(
      seed || ""
    );


  let hash =
    0;


  for(
    let i = 0;
    i < str.length;
    i++
  ){

    hash =
      (
        (
          hash << 5
        )
        -
        hash
        +
        str.charCodeAt(i)
      )
      |
      0;

  }


  return (
    Math.abs(hash) %
    length
  );

}


function salonMessage(){

  const list =
    SALON_MESSAGES[
      uiLang

  return list[
    deterministicIndex(
      state?.roundId,
      list.length
    )
  ];

}

async function loadSpotifyForCurrentRound(){

  if(
    !state ||
    !state.djSecret ||
    !amDj() ||
    spotifyLoadedRound ===
      state.roundId
  ){

    return;

  }


  spotifyLoadedRound =
    state.roundId;


  if(
    !spotifyController
  ){

    $("spotifyEmbed")
      .innerHTML =
        "";

  }


  $("spotifyStatus")
    .textContent =
      t(
        "spotifyLoading"
      );


  $("spotifyStatus")
    .classList
    .remove(
      "hidden"
    );


  $("spotifyExactLink")
    .classList
    .add(
      "hidden"
    );


  if(
    !state.spotifyConfigured
  ){

    $("spotifyStatus")
      .textContent =
        t(
          "spotifyNeedsSetup"
        );


    return;

  }


  try{

    const response =
      await fetch(
        "/api/spotify/track",
        {
          method:
            "POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              roomCode:
                state.code,

              playerToken,

              roundId:
                state.roundId
            })
        }
      );


    const data =
      await response.json();


    if(
      !data.ok
    ){

      if(
        data.error ===
        "TRACK_NOT_FOUND"
      ){

        $("spotifyStatus")
          .textContent =
            t(
              "spotifyNotFound"
            );

      }else if(
        data.error ===
        "SPOTIFY_NOT_CONFIGURED"
      ){

        $("spotifyStatus")
          .textContent =
            t(
              "spotifyNeedsSetup"
            );

      }else{

        $("spotifyStatus")
          .textContent =
            t(
              "spotifyError"
            );

      }


      return;

    }


    if(
      data.url
    ){

      $("spotifyExactLink")
        .href =
          data.url;


      $("spotifyExactLink")
        .classList
        .remove(
          "hidden"
        );

    }


    if(
      !spotifyIframeAPI
    ){

      $("spotifyStatus")
        .textContent =
          t(
            "spotifyLoading"
          );


      spotifyLoadedRound =
        null;


      return;

    }


    $("spotifyStatus")
      .classList
      .add(
        "hidden"
      );


    const element =
      $("spotifyEmbed");


    if(
      !spotifyController
    ){

      spotifyIframeAPI
        .createController(
          element,

          {
            width:
              "100%",

            height:
              152,

            uri:
              data.uri
          },

          controller => {

            spotifyController =
              controller;

          }
        );

    }else{

      spotifyController
        .loadEntity(
          data.uri
        );

    }

  }catch(
    err
  ){

    console.error(
      err
    );


    $("spotifyStatus")
      .textContent =
        t(
          "spotifyError"
        );

  }

}

    .textContent =
      `(${state.players.length}/8)`;


  $("settingsCard")
    .classList
    .toggle(
      "hidden",
      !isHost()
    );


  populateFixedDj();


  if(
    isHost()
  ){

    $("musicMode").value =
      state.musicMode;


    $("difficulty").value =
      state.difficulty;


    $("gameMode").value =
      state.gameMode;


    $("djMode").value =
      state.djMode;


    $("targetCards").value =
      String(
        state.targetCards
      );


    $("autoNext").checked =
      state.autoNext;


    $("revealSeconds").value =
      String(
        state.revealSeconds
      );


    if(
      state.fixedDjToken
    ){

      $("fixedDj").value =
        state.fixedDjToken;

    }

  }


  const fixedVisible =

    isHost() &&

    $("djMode").value ===
      "fixed";


  $("fixedDjWrap")
    .classList
    .toggle(
      "hidden",
      !fixedVisible
    );


  $("djModeNote")
    .textContent =

      $("djMode").value ===
      "rotating"

        ? t(
            "djNoteRotating"
          )

        : t(
            "djNotePermanent"
          );


  $("lobbyPlayers")
    .innerHTML =
      "";


  state.players
    .forEach(
      (
        player,
        index
      ) => {

        const row =
          document.createElement(
            "div"
          );


        row.className =
          "player";


        row.innerHTML = `

          <span>

            ${index + 1}.

            ${escapeHtml(
              player.name
            )}

            ${
              player.isHost
                ? " ✦"
                : ""
            }

            ${
              player.isPermanentDj

                ? `
                  <span class="dj-badge">
                    ${t("permanentDj")}
                  </span>
                `

                : ""
            }

          </span>


          <span
            class="${
              player.connected

                ? "online"

                : "offline"
            }"
          >

            ${
              player.connected

                ? t("present")

                : t("missing")
            }

          </span>

        `;


        $("lobbyPlayers")
          .appendChild(
            row
          );

      }
    );


  $("start")
    .classList
    .toggle(
      "hidden",
      !isHost()
    );


  const connected =
    state.players
      .filter(
        player =>
          player.connected
      )
      .length;


  $("start").disabled =
    connected < 2;


  $("start")
    .textContent =

      connected < 2

        ? t(
            "waitingPlayers"
          )

        : t(
            "start"
          );


  drawQR();

}


function populateFixedDj(){

  const select =
    $("fixedDj");


  const oldValue =
    select.value;


  select.innerHTML =
    "";


  state.players
    .filter(
      player =>
        player.connected
    )
    .forEach(
      player => {

        const option =
          document.createElement(
            "option"
          );


        option.value =
          player.token;


        option.textContent =
          player.name;


        select.appendChild(
          option
        );

      }
    );


  const preferred =

    state.fixedDjToken

    ||

    oldValue

    ||

    state.players
      .find(
        player =>
          player.connected
      )
      ?.token;


  if(
    preferred
  ){

    select.value =
      preferred;

  }

}


$("djMode")
  .addEventListener(
    "change",
    () => {

      $("fixedDjWrap")
        .classList
        .toggle(
          "hidden",

          $("djMode").value !==
          "fixed"
        );


      $("djModeNote")
        .textContent =

          $("djMode").value ===
          "rotating"

            ? t(
                "djNoteRotating"
              )

            : t(
                "djNotePermanent"
              );

    }
  );


/* =========================================================
   GAME
========================================================= */

function renderGame(){

  $("lobby")
    .classList
    .add(
      "hidden"
    );


  $("game")
    .classList
    .remove(
      "hidden"
    );


  $("gameCode")
    .textContent =
      state.code;


  $("modeLabel")
    .textContent =

      state.musicMode ===
      "estonian"

        ? t(
            "estonian"
          )

        : state.musicMode ===
          "mixed"

          ? t(
              "mixed"
            )

          : t(
              "foreign"
            );


  const active =
    state.players
      .find(
        player =>
          player.token ===
          state.activePlayerToken
      );


  const dj =
    state.players
      .find(
        player =>
          player.token ===
          state.djToken
      );


  $("turnLabel")
    .textContent =

      state.gameMode ===
      "everyone"

        ? (

            state.isGuesser

              ? t(
                  "youGuess"
                )

              : t(
                  "roundOff"
                )

          )

        : (

            myTurn()

              ? t(
                  "yourTurn"
                )

              : active

                ? `${active.name} ${t("guesses")}`

                : "…"

          );


  $("turnLabel")
    .classList
    .toggle(
      "turn-me",
      Boolean(
        state.isGuesser
      )
    );


  $("djLabel")
    .textContent =

      `${t("dj")}: ${
        dj
          ? dj.name
          : "?"
      }`;


  $("saloonMessage")
    .textContent =
      salonMessage();


  renderScores();

  renderListen();

  renderTimeline();

  renderHostControls();

  renderReveal();

  renderWinner();

}


/* =========================================================
   SCORE
========================================================= */

function renderScores(){

  $("scores")
    .innerHTML =
      "";


  state.players
    .forEach(
      player => {

        const div =
          document.createElement(
            "div"
          );


        div.className =
          "score";


        div.innerHTML = `

          <strong>
            ${escapeHtml(
              player.name
            )}
          </strong>

          <div class="score-count">

            ${
              player.isPermanentDj

                ? t(
                    "permanentDj"
                  )

                : `${player.timelineCount}/${state.targetCards}`
            }

          </div>

        `;


        $("scores")
          .appendChild(
            div
          );

      }
    );

}


/* =========================================================
   LISTEN / DJ
========================================================= */

function renderListen(){

  $("djBox")
    .classList
    .toggle(
      "hidden",
      !state.djSecret
    );


  if(
    state.djSecret
  ){

    $("djSong")
      .textContent =
        state.djSecret
          .song
          .title;


    $("djArtist")
      .textContent =
        state.djSecret
          .song
          .artist;


    $("listenCopy")
      .textContent =
        t(
          "youAreDj"
        );


    loadSpotifyForCurrentRound();

  }else{

    $("listenCopy")
      .textContent =
        t(
          "listen"
        );

  }

}


/* =========================================================
   TIMELINE
========================================================= */

function renderTimeline(){

  const timeline =
    $("timeline");


  const area =
    $("guessArea");


  timeline.innerHTML =
    "";


  area.innerHTML =
    "";


  const items =
    state.me
      ?.timeline
    ||
    [];


  $("timelineHelp")
    .textContent =

      state.isGuesser &&
      state.phase ===
        "guessing"

        ? t(
            "timelineHelp"
          )

        : "";


  const canGuess =

    state.isGuesser &&

    state.phase ===
      "guessing" &&

    !state.myGuess &&

    !state.finished;


  for(
    let i = 0;
    i <= items.length;
    i++
  ){

    if(
      canGuess
    ){

      const slot =
        document.createElement(
          "button"
        );


      slot.type =
        "button";


      slot.className =
        "insert-slot";


      if(
        i === 0
      ){

        slot.textContent =

          items.length

            ? `${t("before")} ${items[0].year}`

            : t(
                "chooseSlot"
              );

      }else if(
        i ===
        items.length
      ){

        slot.textContent =
          `${t("after")} ${items[i - 1].year}`;

      }else{

        slot.textContent =
          `${items[i - 1].year} — ${items[i].year}`;

      }


      slot
        .addEventListener(
          "click",
          () => {

            selectedSlot =
              i;


            timeline
              .querySelectorAll(
                ".insert-slot"
              )
              .forEach(
                button =>
                  button
                    .classList
                    .remove(
                      "active"
                    )
              );


            slot
              .classList
              .add(
                "active"
              );


            renderGuessDock(
              items
            );


            setTimeout(
              () =>
                slot
                  .scrollIntoView(
                    {
                      behavior:
                        "smooth",

                      block:
                        "center"
                    }
                  ),

              30
            );

          }
        );


      timeline
        .appendChild(
          slot
        );

    }


    if(
      i <
      items.length
    ){

      const card =
        items[i];


      const element =
        document.createElement(
          "div"
        );


      element.className =
        "timeline-card";


      element.innerHTML = `

        <div class="timeline-year">
          ${card.year}
        </div>

        <div class="timeline-copy">

          <div class="timeline-song">
            ${escapeHtml(card.title)}
          </div>

          <div class="timeline-artist">
            ${escapeHtml(card.artist)}
          </div>

        </div>

      `;


      timeline
        .appendChild(
          element
        );

    }

  }


  if(
    state.finished
  ){

    return;

  }


  if(
    state.phase ===
      "reveal" ||

    state.phase ===
      "finished"
  ){

    addLockedMessage(
      area,
      t(
        "roundOpen"
      )
    );


    return;

  }


  if(
    !state.isGuesser
  ){

    addLockedMessage(
      area,

      amDj()

        ? t(
            "djDoesNotGuess"
          )

        : t(
            "otherPlayerGuessing"
          )
    );


    return;

  }


  if(
    state.myGuess
  ){

    addLockedMessage(
      area,
      t(
        "locked"
      )
    );

  }

}


function renderGuessDock(
  items
){

  const area =
    $("guessArea");


  area.innerHTML =
    "";


  if(
    selectedSlot ===
    null
  ){

    return;

  }


  let label =
    "";


  if(
    selectedSlot === 0
  ){

    label =

      items.length

        ? `${t("before")} ${items[0].year}`

        : t(
            "chooseSlot"
          );

  }else if(
    selectedSlot ===
    items.length
  ){

    label =
      `${t("after")} ${items[items.length - 1].year}`;

  }else{

    label =
      `${items[selectedSlot - 1].year} — ${items[selectedSlot].year}`;

  }


  const dock =
    document.createElement(
      "div"
    );


  dock.className =
    "guess-dock";


  const choice =
    document.createElement(
      "div"
    );


  choice.className =
    "choice";


  choice.textContent =
    `${t("selected")}: ${label}`;


  const submit =
    document.createElement(
      "button"
    );


  submit.type =
    "button";


  submit.className =
    "primary full";


  submit.textContent =
    t(
      "confirm"
    );


  submit
    .addEventListener(
      "click",
      () => {

        submit.disabled =
          true;


        socket.emit(
          "submitGuess",

          {
            roundId:
              state.roundId,

            slot:
              selectedSlot
          },

          result => {

            if(
              !result?.ok
            ){

              toast(
                errorFromCode(
                  result?.error
                )
              );


              submit.disabled =
                false;

            }

          }
        );

      }
    );


  dock.appendChild(
    choice
  );


  dock.appendChild(
    submit
  );


  area.appendChild(
    dock
  );

}


function addLockedMessage(
  area,
  text
){

  const message =
    document.createElement(
      "div"
    );


  message.className =
    "locked";


  message.textContent =
    text;


  area.appendChild(
    message
  );

}


/* =========================================================
   HOST
========================================================= */

function renderHostControls(){

  const visible =

    isHost() &&

    state.started &&

    !state.finished;


  $("hostControls")
    .classList
    .toggle(
      "hidden",
      !visible
    );


  if(
    !visible
  ){

    return;

  }


  if(
    state.phase ===
      "guessing"
  ){

    const waiting =
      state.waitingFor ||
      [];


    $("waitingText")
      .textContent =

        waiting.length

          ? `${t("waitingFor")}: ${waiting.join(", ")}`

          : t(
              "everyoneAnswered"
            );


    $("revealNow")
      .classList
      .remove(
        "hidden"
      );

  }else{

    $("waitingText")
      .textContent =
        t(
          "roundRevealed"
        );


    $("revealNow")
      .classList
      .add(
        "hidden"
      );

  }

}


/* =========================================================
   REVEAL
========================================================= */

function renderReveal(){

  const box =
    $("revealBox");


  if(
    !state.reveal ||

    state.phase ===
      "guessing"
  ){

    box
      .classList
      .add(
        "hidden"
      );


    return;

  }


  box
    .classList
    .remove(
      "hidden"
    );


  const myResult =
    state.reveal.results
      .find(
        result =>
          result.token ===
          playerToken
      );


  $("revealYear")
    .textContent =
      state.reveal
        .song
        .year;


  $("revealSong")
    .textContent =
      state.reveal
        .song
        .title;


  $("revealArtist")
    .textContent =
      state.reveal
        .song
        .artist;


  const headline =

    amDj()

      ? t(
          "secretRevealed"
        )

      : myResult

        ? (

            myResult.correct

              ? t(
                  "bravo"
                )

              : t(
                  "tragedy"
                )

          )

        : t(
            "answerRevealed"
          );


  $("revealHeadline")
    .textContent =
      headline;


  $("revealHeadline")
    .className =

      "result " +

      (

        myResult
          ?.correct

          ? "good"

          : myResult

            ? "bad"

            : ""

      );


  const quote =
    LYNCH_QUOTES[
      deterministicIndex(
        state.roundId,
        LYNCH_QUOTES.length
      )
    ];


  $("revealQuote")
    .innerHTML = `

      “${escapeHtml(
        quote.text
      )}”

      <cite>
        — ${escapeHtml(
          quote.author
        )}
      </cite>

    `;


  $("roundResults")
    .innerHTML =
      "";


  state.reveal.results
    .forEach(
      result => {

        const row =
          document.createElement(
            "div"
          );


        row.className =
          "round-result";


        row.innerHTML = `

          <strong>
            ${escapeHtml(result.name)}
          </strong>

          <span>
            ${
              result.correct

                ? t(
                    "correct"
                  )

                : t(
                    "wrong"
                  )
            }
          </span>

        `;


        $("roundResults")
          .appendChild(
            row
          );

      }
    );


  const auto =

    state.autoNext &&

    !state.finished;


  $("autoProgress")
    .classList
    .toggle(
      "hidden",
      !auto
    );


  if(
    auto &&

    currentRoundForProgress !==
      state.roundId
  ){

    currentRoundForProgress =
      state.roundId;


    const bar =
      $("autoProgress")
        .firstElementChild;


    bar.style
      .setProperty(
        "--seconds",
        `${state.revealSeconds}s`
      );


    bar.style.animation =
      "none";


    void bar.offsetWidth;


    bar.style.animation =
      "";

  }


  $("next")
    .classList
    .toggle(
      "hidden",

      !isHost() ||

      state.finished
    );


  if(
    lastRevealRound !==
    state.roundId
  ){

    lastRevealRound =
      state.roundId;


    box
      .classList
      .remove(
        "reveal-live"
      );


    void box.offsetWidth;


    box
      .classList
      .add(
        "reveal-live"
      );


    setTimeout(
      () =>
        box
          .scrollIntoView(
            {
              behavior:
                "smooth",

              block:
                "start"
            }
          ),

      80
    );

  }

}


/* =========================================================
   WINNER
========================================================= */

function renderWinner(){

  const box =
    $("winnerBox");


  if(
    !state.finished
  ){

    box
      .classList
      .add(
        "hidden"
      );


    return;

  }


  const winner =
    state.players
      .find(
        player =>
          player.token ===
          state.winnerToken
      );


  box
    .classList
    .remove(
      "hidden"
    );


  box.innerHTML = `

    <img
      src="/images/destudio-venus.jpg"
      class="winner-photo"
      alt=""
    >

    <div class="win-title">
      ${t("winnerIntro")}
    </div>

    <div class="win-name">
      ${escapeHtml(
        winner?.name ||
        "?"
      )}
    </div>

    <div class="subtitle center">
      ${t("winnerText")}
    </div>

  `;


  if(
    isHost()
  ){

    const button =
      document.createElement(
        "button"
      );


    button.type =
      "button";


    button.className =
      "primary full";


    button.style.marginTop =
      "18px";


    button.textContent =
      t(
        "again"
      );


    button
      .addEventListener(
        "click",
        () => {

          socket.emit(
            "restart",
            {},

            result => {

              if(
                !result?.ok
              ){

                toast(
                  errorFromCode(
                    result?.error
                  )
                );

              }

            }
          );

        }
      );


    box.appendChild(
      button
    );

  }

}


/* =========================================================
   QR
========================================================= */

function drawQR(){

  const element =
    $("qr");


  element.innerHTML =
    "";


  if(
    typeof QRCode ===
    "undefined"
  ){

    element.innerHTML = `

      <div
        style="
          padding:12px;
          color:#111;
        "
      >
        QR unavailable
      </div>

    `;


    return;

  }


  new QRCode(
    element,

    {
      text:
        joinUrl(),

      width:
        168,

      height:
        168,

      colorDark:
        "#381019",

      colorLight:
        "#ffffff",

      correctLevel:
        QRCode
          .CorrectLevel
          .M
    }
  );

}


/* =========================================================
   SAFE HTML
========================================================= */

function escapeHtml(value){

  return String(value)
    .replace(
      /[&<>"']/g,

      character => ({

        "&":
          "&amp;",

        "<":
          "&lt;",

        ">":
          "&gt;",

        '"':
          "&quot;",

        "'":
          "&#39;"

      })[character]
    );

}


})();
