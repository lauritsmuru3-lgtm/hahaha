<!doctype html>
<html lang="et">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0909">

<title>kõrva(n)uss</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
:root{
  color-scheme:dark;

  --black:#090808;
  --panel:#151212;
  --panel2:#211b1a;
  --bone:#eee5d8;
  --skin:#c69b84;
  --blood:#7b1f26;
  --red:#d13a45;
  --acid:#d9ff52;
  --muted:#a89d95;
  --line:#4b3a35;
  --green:#a8ff9c;
  --wrong:#ff7171;
}

*{
  box-sizing:border-box;
}

html{
  background:var(--black);
}

body{
  margin:0;
  background:var(--black);
  color:var(--bone);
  font-family:"Space Mono",monospace;
  min-height:100%;
}

button,
input,
select{
  font:inherit;
}

button,
a{
  -webkit-tap-highlight-color:transparent;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* ---------- BACKGROUND ---------- */

.bg{
  position:fixed;
  inset:0;
  z-index:-3;
  background:
    linear-gradient(rgba(6,5,5,.86),rgba(6,5,5,.96)),
    url("/images/destudio-venus.jpg") center/cover;
}

.grain{
  position:fixed;
  inset:0;
  z-index:-2;
  pointer-events:none;
  opacity:.12;
  background-image:
    repeating-radial-gradient(
      circle at 20% 30%,
      #fff 0,
      #fff 1px,
      transparent 1px,
      transparent 3px
    );
  background-size:7px 7px;
  mix-blend-mode:soft-light;
}

.scanlines{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:999;
  opacity:.045;
  background:
    repeating-linear-gradient(
      0deg,
      rgba(255,255,255,.35) 0,
      rgba(255,255,255,.35) 1px,
      transparent 1px,
      transparent 4px
    );
}

/* ---------- LAYOUT ---------- */

main{
  width:min(780px,100%);
  margin:auto;
  padding:
    max(22px,env(safe-area-inset-top))
    16px
    60px;
}

.logo{
  font-family:"Press Start 2P",monospace;
  font-size:clamp(27px,8vw,58px);
  line-height:1.25;
  letter-spacing:-.07em;
  margin:8px 0 7px;
  color:var(--bone);
  text-shadow:
    3px 3px 0 var(--blood),
    -1px -1px 0 rgba(255,255,255,.12);
}

.logo span{
  color:var(--acid);
}

.subtitle{
  color:var(--muted);
  margin:10px 0 24px;
  line-height:1.5;
}

.screen-label{
  font-family:"Press Start 2P",monospace;
  font-size:10px;
  line-height:1.6;
  color:var(--acid);
  text-transform:uppercase;
  margin-bottom:9px;
}

.panel{
  background:rgba(20,16,16,.92);
  border:1px solid var(--line);
  border-radius:4px;
  padding:17px;
  margin:14px 0;
  position:relative;
  overflow:hidden;
}

.panel::before{
  content:"";
  position:absolute;
  left:0;
  top:0;
  width:4px;
  height:100%;
  background:var(--blood);
}

.panel.acid::before{
  background:var(--acid);
}

.panel.clean::before{
  display:none;
}

.flex{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  align-items:center;
}

.between{
  justify-content:space-between;
}

.grid{
  display:grid;
  gap:12px;
}

.grid2{
  grid-template-columns:repeat(2,minmax(0,1fr));
}

.muted{
  color:var(--muted);
}

.small{
  font-size:13px;
  line-height:1.5;
}

.micro{
  font-size:11px;
  color:var(--muted);
}

/* ---------- INPUTS ---------- */

input,
select{
  width:100%;
  min-height:50px;
  padding:12px 13px;
  margin-top:7px;

  border:1px solid var(--line);
  border-radius:2px;

  background:#0d0b0b;
  color:var(--bone);
  font-size:16px;

  outline:none;
}

input:focus,
select:focus{
  border-color:var(--acid);
  box-shadow:0 0 0 2px rgba(217,255,82,.15);
}

/* ---------- BUTTONS ---------- */

button,
.button{
  min-height:50px;
  padding:12px 15px;
  border:1px solid var(--line);
  border-radius:2px;

  background:#1b1616;
  color:var(--bone);

  font-weight:700;
  text-decoration:none;

  display:inline-flex;
  align-items:center;
  justify-content:center;

  transition:
    transform .1s ease,
    background .1s ease;
}

button:active,
.button:active{
  transform:translateY(2px);
}

.primary{
  background:var(--acid);
  border-color:var(--acid);
  color:#090909;
}

.danger{
  background:var(--blood);
  border-color:var(--blood);
}

button:disabled{
  opacity:.38;
  cursor:not-allowed;
}

.full{
  width:100%;
}

/* ---------- HOME ---------- */

.hero-photo{
  height:230px;
  margin:15px 0 18px;

  background:
    linear-gradient(90deg,rgba(0,0,0,.25),rgba(0,0,0,.05)),
    url("/images/sonavabadus.jpg") center/cover;

  border:1px solid #2d2522;
  position:relative;
  overflow:hidden;
}

.hero-photo::after{
  content:"KUULA / ARVA / PAIGUTA";
  position:absolute;
  bottom:12px;
  left:12px;

  font-family:"Press Start 2P",monospace;
  font-size:9px;

  padding:8px;
  background:#050505;
  color:var(--acid);
}

/* ---------- LOBBY ---------- */

.room-code{
  font-family:"Press Start 2P",monospace;
  color:var(--acid);
  font-size:clamp(34px,12vw,66px);
  letter-spacing:.08em;
  margin:10px 0 18px;
}

.join-layout{
  display:grid;
  grid-template-columns:1fr 190px;
  gap:16px;
  align-items:center;
}

.qr-frame{
  background:white;
  padding:8px;
  width:184px;
  height:184px;
  margin:auto;
}

#qr{
  width:168px;
  height:168px;
}

.players{
  display:grid;
}

.player{
  display:flex;
  justify-content:space-between;
  gap:14px;
  padding:12px 2px;
  border-bottom:1px dashed var(--line);
}

.player:last-child{
  border-bottom:0;
}

.online{
  color:var(--green);
}

/* ---------- GAME TOP ---------- */

.status-row{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
}

.pill{
  padding:7px 9px;
  background:#171313;
  border:1px solid var(--line);
  font-size:11px;
}

.turn-me{
  background:var(--acid);
  color:#080808;
  border-color:var(--acid);
}

/* ---------- SCORE ---------- */

.scoreboard{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
  gap:8px;
  margin:13px 0;
}

.score{
  background:rgba(8,7,7,.82);
  border:1px solid var(--line);
  padding:10px;
}

.score strong{
  display:block;
}

.score-count{
  margin-top:5px;
  color:var(--acid);
  font-size:12px;
}

/* ---------- NOW PLAYING ---------- */

.listen-panel{
  min-height:220px;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;

  background:
    linear-gradient(
      180deg,
      rgba(5,4,4,.25),
      rgba(5,4,4,.92)
    ),
    url("/images/sonavabadus.jpg") center/cover;
}

.mystery{
  font-family:"Press Start 2P",monospace;
  font-size:clamp(19px,5vw,31px);
  line-height:1.5;
}

.listen-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:14px;
}

.spotify{
  background:#b6ff94;
  color:#071008;
  border-color:#b6ff94;
}

.youtube{
  background:var(--bone);
  color:#111;
  border-color:var(--bone);
}

/* ---------- TIMELINE ---------- */

.timeline-title{
  margin-bottom:14px;
}

.timeline{
  display:flex;
  flex-direction:column;
}

.timeline-card{
  position:relative;
  border:1px solid #59443d;
  background:#100d0d;
  padding:14px;
}

.timeline-year{
  font-family:"Press Start 2P",monospace;
  font-size:22px;
  color:var(--skin);
  margin-bottom:7px;
}

.timeline-song{
  font-weight:700;
}

.timeline-artist{
  margin-top:3px;
  color:var(--muted);
  font-size:12px;
}

.slot{
  min-height:46px;
  width:100%;
  margin:7px 0;

  border:1px dashed #806c61;
  background:transparent;

  color:var(--muted);
  font-size:12px;
}

.slot::before{
  content:"+ ";
  color:var(--acid);
}

.slot.active{
  background:var(--acid);
  color:#070707;
  border-color:var(--acid);
  border-style:solid;
}

.slot.active::before{
  color:#070707;
}

/* ---------- REVEAL ---------- */

.reveal{
  min-height:420px;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;

  background:
    linear-gradient(
      180deg,
      rgba(0,0,0,.06),
      rgba(5,4,4,.94)
    ),
    url("/images/godshave.jpg") center/cover;
}

.result{
  font-family:"Press Start 2P",monospace;
  font-size:clamp(24px,7vw,45px);
  line-height:1.3;
}

.good{
  color:var(--green);
}

.bad{
  color:var(--wrong);
}

.big-year{
  font-family:"Press Start 2P",monospace;
  font-size:clamp(48px,15vw,95px);
  line-height:1;
  margin:20px 0;
  color:var(--bone);
  text-shadow:5px 5px 0 var(--blood);
}

.reveal-song{
  font-size:22px;
  font-weight:700;
}

.reveal-artist{
  color:var(--skin);
  margin-top:5px;
}

.auto-progress{
  height:5px;
  background:#362b28;
  margin-top:15px;
  overflow:hidden;
}

.auto-progress > div{
  width:100%;
  height:100%;
  background:var(--acid);
  transform-origin:left;
  animation:countdown 4.5s linear forwards;
}

@keyframes countdown{
  from{transform:scaleX(1)}
  to{transform:scaleX(0)}
}

/* ---------- WIN ---------- */

.winner{
  min-height:460px;

  display:flex;
  flex-direction:column;
  justify-content:flex-end;

  background:
    linear-gradient(
      rgba(0,0,0,.08),
      rgba(0,0,0,.94)
    ),
    url("/images/destudio-venus.jpg") center/cover;
}

.win-title{
  font-family:"Press Start 2P",monospace;
  font-size:14px;
  color:var(--acid);
}

.win-name{
  font-family:"Press Start 2P",monospace;
  font-size:clamp(27px,9vw,58px);
  line-height:1.4;
  margin:13px 0;
}

/* ---------- MOBILE ---------- */

@media(max-width:600px){

  main{
    padding-left:13px;
    padding-right:13px;
  }

  .grid2,
  .join-layout,
  .listen-buttons{
    grid-template-columns:1fr;
  }

  .qr-frame{
    margin:12px 0 0;
  }

  .hero-photo{
    height:190px;
  }

  .reveal{
    min-height:390px;
  }
}

@media(prefers-reduced-motion:reduce){
  *{
    animation:none!important;
    transition:none!important;
  }
}
</style>
</head>

<body>

<div class="bg"></div>
<div class="grain"></div>
<div class="scanlines"></div>

<main>

<header>
  <div class="logo">kõrva<span>(n)</span>uss</div>
  <div class="subtitle">
    muusika ajas // 2–8 mängijat
  </div>
</header>


<!-- ================= HOME ================= -->

<section id="home">

  <div class="hero-photo"></div>

  <div class="panel acid">
    <div class="screen-label">PLAYER NAME</div>

    <input
      id="name"
      maxlength="24"
      autocomplete="nickname"
      placeholder="sisesta nimi"
    >
  </div>

  <div class="grid grid2">

    <button
      id="create"
      class="primary"
      type="button"
    >
      UUS MÄNG
    </button>

    <button
      id="showJoin"
      type="button"
    >
      LIITU
    </button>

  </div>


  <div
    id="joinBox"
    class="panel hidden"
  >

    <div class="screen-label">
      ENTER ROOM
    </div>

    <input
      id="code"
      maxlength="4"
      autocapitalize="characters"
      placeholder="TOA KOOD"
    >

    <button
      id="join"
      class="primary full"
      style="margin-top:10px"
      type="button"
    >
      SISENE
    </button>

  </div>

  <p
    id="homeError"
    class="small"
    style="color:var(--wrong)"
  ></p>

</section>


<!-- ================= LOBBY ================= -->

<section
  id="lobby"
  class="hidden"
>

  <div class="panel acid">

    <div class="screen-label">
      ROOM CODE
    </div>

    <div
      id="roomCode"
      class="room-code"
    ></div>

    <div class="join-layout">

      <div>

        <p class="small muted">
          Skänni QR või jaga liitumislinki.
        </p>

        <button
          id="copyLink"
          type="button"
        >
          KOPEERI LINK
        </button>

      </div>

      <div class="qr-frame">
        <div id="qr"></div>
      </div>

    </div>

  </div>


  <div
    id="settingsCard"
    class="panel hidden"
  >

    <div class="screen-label">
      GAME SETTINGS
    </div>

    <div class="grid grid2">

      <label>
        MUUSIKA

        <select id="musicMode">
          <option value="estonian">
            Eesti
          </option>

          <option value="foreign">
            Välismaa
          </option>

          <option value="mixed">
            Eesti + välismaa
          </option>
        </select>
      </label>


      <label>
        VÕIDUKS KAARTE

        <select id="targetCards">
          <option>5</option>
          <option>6</option>
          <option>7</option>
          <option selected>8</option>
          <option>9</option>
          <option>10</option>
          <option>12</option>
          <option>15</option>
        </select>
      </label>

    </div>


    <label
      class="flex small"
      style="margin-top:15px"
    >

      <input
        id="autoNext"
        type="checkbox"
        checked
        style="
          width:auto;
          min-height:auto;
          margin:0;
        "
      >

      järgmine voor automaatselt

    </label>

  </div>


  <div class="panel">

    <div class="screen-label">
      PLAYERS
      <span id="count"></span>
    </div>

    <div
      id="lobbyPlayers"
      class="players"
    ></div>


    <button
      id="start"
      class="primary full hidden"
      style="margin-top:15px"
      type="button"
    >
      START
    </button>

  </div>

</section>


<!-- ================= GAME ================= -->

<section
  id="game"
  class="hidden"
>

  <div class="status-row">

    <span class="pill">
      ROOM
      <b id="gameCode"></b>
    </span>

    <span
      id="modeLabel"
      class="pill"
    ></span>

    <span
      id="turnLabel"
      class="pill"
    ></span>

  </div>


  <div
    id="scores"
    class="scoreboard"
  ></div>


  <!-- LISTEN -->

  <div class="panel clean listen-panel">

    <div class="screen-label">
      TRACK UNKNOWN
    </div>

    <div class="mystery">
      ????
    </div>

    <div class="small muted">
      kuula. ära otsi aastat.
    </div>


    <div class="listen-buttons">

      <a
        id="spotifyLink"
        class="button spotify"
        target="_blank"
        rel="noopener"
      >
        ▶ SPOTIFY
      </a>

      <a
        id="youtubeLink"
        class="button youtube"
        target="_blank"
        rel="noopener"
      >
        ▶ YOUTUBE
      </a>

    </div>

  </div>


  <!-- TIMELINE -->

  <div class="panel">

    <div class="screen-label timeline-title">
      YOUR TIMELINE
    </div>

    <div id="timeline"></div>

    <div id="guessArea"></div>

  </div>


  <!-- REVEAL -->

  <div
    id="revealBox"
    class="panel clean reveal hidden"
  >

    <div
      id="revealResult"
      class="result"
    ></div>

    <div
      id="revealYear"
      class="big-year"
    ></div>

    <div
      id="revealSong"
      class="reveal-song"
    ></div>

    <div
      id="revealArtist"
      class="reveal-artist"
    ></div>

    <div
      id="autoProgress"
      class="auto-progress hidden"
    >
      <div></div>
    </div>

    <button
      id="next"
      class="primary full hidden"
      style="margin-top:15px"
      type="button"
    >
      NEXT
    </button>

  </div>


  <!-- WINNER -->

  <div
    id="winnerBox"
    class="panel clean winner hidden"
  ></div>

</section>

</main>


<script src="/socket.io/socket.io.js"></script>

<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>


<script>
(() => {

const socket = io();

const $ = id =>
  document.getElementById(id);

let state = null;
let selectedSlot = null;
let settingsTimer = null;


const params =
  new URLSearchParams(
    location.search
  );


if(params.get("room")){

  $("code").value =
    params
      .get("room")
      .toUpperCase()
      .slice(0,4);

  $("joinBox")
    .classList
    .remove("hidden");
}


$("showJoin")
  .addEventListener(
    "click",
    () =>
      $("joinBox")
        .classList
        .toggle("hidden")
  );


const playerName = () =>
  $("name").value.trim();


function error(message){

  $("homeError")
    .textContent =
      message || "";

}


$("create")
  .addEventListener(
    "click",
    () => {

      socket.emit(
        "createRoom",
        {
          name:
            playerName()
        },
        result => {

          if(!result.ok){
            return error(
              result.error
            );
          }

          history.replaceState(
            {},
            "",
            "?room=" +
            result.code
          );

        }
      );

    }
  );


$("join")
  .addEventListener(
    "click",
    () => {

      socket.emit(
        "joinRoom",
        {
          name:
            playerName(),

          code:
            $("code").value
        },

        result => {

          if(!result.ok){
            return error(
              result.error
            );
          }

          history.replaceState(
            {},
            "",
            "?room=" +
            result.code
          );

        }
      );

    }
  );


$("start")
  .addEventListener(
    "click",
    () => {

      socket.emit(
        "startGame",
        {},
        result => {

          if(!result.ok){
            alert(
              result.error
            );
          }

        }
      );

    }
  );


$("next")
  .addEventListener(
    "click",
    () => {

      socket.emit(
        "nextRound",
        {},
        result => {

          if(!result.ok){
            alert(
              result.error
            );
          }

        }
      );

    }
  );


$("copyLink")
  .addEventListener(
    "click",
    async () => {

      const url =
        joinUrl();

      try{

        await navigator
          .clipboard
          .writeText(url);

        $("copyLink")
          .textContent =
            "KOPEERITUD ✓";

        setTimeout(
          () => {

            $("copyLink")
              .textContent =
                "KOPEERI LINK";

          },
          1600
        );

      }catch{

        prompt(
          "Kopeeri link:",
          url
        );

      }

    }
  );


[
  "musicMode",
  "targetCards",
  "autoNext"
]
.forEach(id => {

  $(id)
    .addEventListener(
      "change",
      () => {

        clearTimeout(
          settingsTimer
        );

        settingsTimer =
          setTimeout(
            () => {

              socket.emit(
                "settings",
                {
                  musicMode:
                    $("musicMode")
                      .value,

                  targetCards:
                    Number(
                      $("targetCards")
                        .value
                    ),

                  autoNext:
                    $("autoNext")
                      .checked
                }
              );

            },
            150
          );

      }
    );

});


socket.on(
  "state",
  newState => {

    state =
      newState;

    selectedSlot =
      null;

    render();

  }
);


function isHost(){

  return (
    state &&
    state.hostId ===
    socket.id
  );

}


function myTurn(){

  return (
    state &&
    state.currentPlayerId ===
    socket.id
  );

}


function joinUrl(){

  return (
    location.origin +
    location.pathname +
    "?room=" +
    encodeURIComponent(
      state.code
    )
  );

}


function render(){

  if(!state){
    return;
  }

  $("home")
    .classList
    .add("hidden");

  if(!state.started){
    renderLobby();
  }else{
    renderGame();
  }

}


/* ---------- LOBBY ---------- */

function renderLobby(){

  $("lobby")
    .classList
    .remove("hidden");

  $("game")
    .classList
    .add("hidden");


  $("roomCode")
    .textContent =
      state.code;


  $("count")
    .textContent =
      `(${state.players.length}/8)`;


  $("settingsCard")
    .classList
    .toggle(
      "hidden",
      !isHost()
    );


  if(isHost()){

    $("musicMode")
      .value =
        state.musicMode;

    $("targetCards")
      .value =
        String(
          state.targetCards
        );

    $("autoNext")
      .checked =
        state.autoNext;

  }


  const players =
    $("lobbyPlayers");

  players.innerHTML =
    "";


  state.players
    .forEach(
      (player,index) => {

        const row =
          document.createElement(
            "div"
          );

        row.className =
          "player";

        row.innerHTML = `
          <span>
            ${index + 1}.
            ${escapeHtml(player.name)}
            ${player.isHost ? " ★" : ""}
          </span>

          <span class="${player.connected ? "online" : ""}">
            ${player.connected ? "ONLINE" : "OFFLINE"}
          </span>
        `;

        players
          .appendChild(row);

      }
    );


  $("start")
    .classList
    .toggle(
      "hidden",
      !isHost()
    );


  $("start")
    .disabled =
      state.players.length < 2;


  $("start")
    .textContent =
      state.players.length < 2
        ? "WAITING..."
        : "START";


  drawQR();

}


/* ---------- GAME ---------- */

function renderGame(){

  $("lobby")
    .classList
    .add("hidden");

  $("game")
    .classList
    .remove("hidden");


  $("gameCode")
    .textContent =
      state.code;


  $("modeLabel")
    .textContent =
      state.musicMode ===
      "estonian"
        ? "EE"
        : state.musicMode ===
          "mixed"
          ? "EE + WORLD"
          : "WORLD";


  const currentPlayer =
    state.players
      .find(
        player =>
          player.id ===
          state.currentPlayerId
      );


  $("turnLabel")
    .textContent =
      myTurn()
        ? "SINU KORD"
        : "KORD: " +
          (
            currentPlayer
              ? currentPlayer.name
              : ""
          );


  $("turnLabel")
    .classList
    .toggle(
      "turn-me",
      myTurn()
    );


  if(state.listening){

    $("spotifyLink")
      .href =
        state.listening
          .spotify;

    $("youtubeLink")
      .href =
        state.listening
          .youtube;

  }


  renderScores();

  renderTimeline();

  renderReveal();

  renderWinner();

}


/* ---------- SCORES ---------- */

function renderScores(){

  const scores =
    $("scores");

  scores.innerHTML =
    "";


  state.players
    .forEach(player => {

      const div =
        document.createElement(
          "div"
        );

      div.className =
        "score";

      div.innerHTML = `
        <strong>
          ${escapeHtml(player.name)}
        </strong>

        <div class="score-count">
          ${player.timelineCount}
          /
          ${state.targetCards}
        </div>
      `;

      scores
        .appendChild(div);

    });

}


/* ---------- TIMELINE ---------- */

function renderTimeline(){

  const container =
    $("timeline");

  const guessArea =
    $("guessArea");

  container.innerHTML =
    "";

  guessArea.innerHTML =
    "";


  const items =
    state.me
      ? state.me.timeline
      : [];


  items.forEach(
    card => {

      const element =
        document.createElement(
          "div"
        );

      element.className =
        "timeline-card";

      element.innerHTML = `
        <div class="timeline-year">
          ${card.year}
        </div>

        <div class="timeline-song">
          ${escapeHtml(card.title)}
        </div>

        <div class="timeline-artist">
          ${escapeHtml(card.artist)}
        </div>
      `;

      container
        .appendChild(element);

    }
  );


  if(
    !myTurn() ||
    state.reveal ||
    state.finished
  ){

    const message =
      document.createElement(
        "p"
      );

    message.className =
      "small muted";


    if(state.finished){

      message.textContent =
        "GAME OVER";

    }else if(myTurn()){

      message.textContent =
        "vastus lukustatud.";

    }else{

      const current =
        state.players.find(
          player =>
            player.id ===
            state.currentPlayerId
        );

      message.textContent =
        current
          ? `${current.name} paigutab lugu...`
          : "oota...";

    }


    guessArea
      .appendChild(message);

    return;

  }


  const intro =
    document.createElement(
      "p"
    );

  intro.className =
    "small muted";

  intro.textContent =
    "Kuhu tundmatu lugu ajajoonel kuulub?";

  guessArea
    .appendChild(intro);


  const slots =
    document.createElement(
      "div"
    );


  for(
    let i = 0;
    i <= items.length;
    i++
  ){

    const button =
      document.createElement(
        "button"
      );

    button.type =
      "button";

    button.className =
      "slot";


    if(i === 0){

      button.textContent =
        items.length
          ? `enne ${items[0].year}`
          : "siia";

    }else if(
      i === items.length
    ){

      button.textContent =
        `pärast ${items[i-1].year}`;

    }else{

      button.textContent =
        `${items[i-1].year} — ${items[i].year}`;

    }


    button
      .addEventListener(
        "click",
        () => {

          selectedSlot =
            i;

          slots
            .querySelectorAll(
              ".slot"
            )
            .forEach(
              slot =>
                slot.classList
                  .remove(
                    "active"
                  )
            );

          button
            .classList
            .add(
              "active"
            );

          submit
            .disabled =
              false;

        }
      );


    slots
      .appendChild(button);

  }


  guessArea
    .appendChild(slots);


  const submit =
    document.createElement(
      "button"
    );

  submit.type =
    "button";

  submit.className =
    "primary full";

  submit.style.marginTop =
    "13px";

  submit.textContent =
    "LUKUSTA";

  submit.disabled =
    true;


  submit
    .addEventListener(
      "click",
      () => {

        submit.disabled =
          true;

        socket.emit(
          "guessSlot",
          {
            slot:
              selectedSlot
          },

          result => {

            if(!result.ok){

              alert(
                result.error
              );

              submit.disabled =
                false;

            }

          }
        );

      }
    );


  guessArea
    .appendChild(submit);

}


/* ---------- REVEAL ---------- */

function renderReveal(){

  const box =
    $("revealBox");


  if(!state.reveal){

    box
      .classList
      .add("hidden");

    return;

  }


  box
    .classList
    .remove("hidden");


  $("revealResult")
    .textContent =
      state.reveal.correct
        ? "ÕIGE"
        : "VALE";


  $("revealResult")
    .className =
      "result " +
      (
        state.reveal.correct
          ? "good"
          : "bad"
      );


  $("revealYear")
    .textContent =
      state.reveal.year;


  $("revealSong")
    .textContent =
      state.reveal.title;


  $("revealArtist")
    .textContent =
      state.reveal.artist;


  $("autoProgress")
    .classList
    .toggle(
      "hidden",
      !state.autoNext ||
      state.finished
    );


  $("next")
    .classList
    .toggle(
      "hidden",
      !isHost() ||
      state.finished
    );

}


/* ---------- WINNER ---------- */

function renderWinner(){

  const box =
    $("winnerBox");


  if(!state.finished){

    box
      .classList
      .add("hidden");

    return;

  }


  const winner =
    state.players.find(
      player =>
        player.id ===
        state.winnerId
    );


  box
    .classList
    .remove("hidden");


  box.innerHTML = `
    <div class="win-title">
      GAME OVER
    </div>

    <div class="win-name">
      ${
        escapeHtml(
          winner
            ? winner.name
            : "?"
        )
      }
    </div>

    <div class="small muted">
      kõrva(n)uss on leidnud peremehe.
    </div>
  `;


  if(isHost()){

    const restart =
      document.createElement(
        "button"
      );

    restart.type =
      "button";

    restart.className =
      "primary full";

    restart.style.marginTop =
      "18px";

    restart.textContent =
      "PLAY AGAIN";


    restart
      .addEventListener(
        "click",
        () => {

          socket.emit(
            "restart",
            {},
            result => {

              if(!result.ok){
                alert(
                  result.error
                );
              }

            }
          );

        }
      );


    box
      .appendChild(
        restart
      );

  }

}


/* ---------- QR ---------- */

function drawQR(){

  const element =
    $("qr");

  element.innerHTML =
    "";


  if(
    typeof QRCode ===
    "undefined"
  ){

    element.innerHTML =
      `<div style="color:#111;font-size:11px;padding:10px">
        QR unavailable
      </div>`;

    return;

  }


  new QRCode(
    element,
    {
      text:
        joinUrl(),

      width:
        168,

      height:
        168,

      colorDark:
        "#050505",

      colorLight:
        "#ffffff",

      correctLevel:
        QRCode
          .CorrectLevel
          .M
    }
  );

}


/* ---------- SAFE TEXT ---------- */

function escapeHtml(value){

  return String(value)
    .replace(
      /[&<>"']/g,
      character => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"
      })[character]
    );

}

})();
</script>
